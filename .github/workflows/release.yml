name: Release

# Manual only. Builds and verifies the distribution and keeps it as a workflow artifact.
#
# It does not publish anywhere. The name `errorbars` on PyPI belongs to a different,
# unrelated project, so an upload under that name would be rejected, and putting it on
# TestPyPI would only rehearse a release that cannot happen. The publish job (TestPyPI or
# PyPI via Trusted Publishing) was removed on 2026-10-21 for that reason. This project runs
# from GitHub: `uvx --from git+https://github.com/jimmyjames177414/errorbars errorbars`.
# Publishing to an index needs a distribution name this project owns first.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install
        run: uv pip install --system -e ".[dev]"

      # Shipping something that does not pass its own tests would be worse than not
      # shipping at all, so the gate is here rather than assumed from CI.
      - name: Verify before building
        run: |
          ruff check .
          ruff format --check .
          mypy --strict src/
          pytest -m "not live" -q

      - name: Build
        run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
